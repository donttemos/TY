# @file CI 主流水线：构建 + 单测（SQLite）+ 三库集成矩阵 + 静态检查
# @description 任一数据库失败即阻断合并（PRD-002 FR-07）。SQLite 矩阵每次 PR 跑；
#   MySQL/PG 矩阵用 service 容器并行。集成测试经 DB_DRIVER/DB_URL 切库（同一套断言，见 repository-suite.ts）。
# @author donttemo
# @created 2026-10-12
# @modified 2026-10-13 donttemo 纳入 @fw/auth（构建 + 覆盖率门禁）并新增 M3 鉴权端到端冒烟步骤
# @modified 2026-10-13 donttemo 纳入 @fw/cache（构建 + 覆盖率门禁）并新增 M4 缓存层端到端冒烟步骤
# @modified 2026-10-13 donttemo 三库矩阵改用方言 schema 变体 + migrate diff 建表（原 sed 改 provider 后
#   跑 SQLite 迁移 SQL 的方式在 MySQL/PG 上必然失败），并改为共用 repository-suite 的矩阵测试
# @modified 2026-10-13 donttemo 纳入 apps/admin-web：构建列表增加该包，新增 M5 门禁步骤（单测 + mock
#   全链路冒烟）；其 test 脚本同步移除 --passWithNoTests（已有真实测试，门禁须真实生效）
# @modified 2026-10-13 donttemo M6：单测覆盖率循环纳入 @fw/cli（生成器 116 用例 / 覆盖率 ≥80% 门禁）
# @modified 2026-10-13 donttemo M7：纳入 @fw/queue（构建 + 覆盖率门禁）并新增 M7 队列端到端冒烟步骤
#   （memory 驱动全能力 + 并发/限速 + 配置守卫；bullmq 阶段由 SMOKE_REDIS_URL 门控，CI 未设置则跳过）
# @modified 2026-10-14 donttemo M8 T-M8-05：纳入 @fw/transport（构建 + 覆盖率门禁）并新增 M8 传输层
#   端到端冒烟步骤（in-process 全能力 + 配置守卫；redis 阶段由 SMOKE_REDIS_URL 门控，CI 未设置则跳过）
# @modified 2026-10-14 donttemo M8 T-M8-06：纳入 @fw/telemetry（构建 + 覆盖率门禁）并新增 M8 链路追踪
#   端到端冒烟步骤（本地 mock OTLP 收集器；未启用/全采/跨服务同 traceId/采样门控/错误全采/配置守卫）
# @modified 2026-10-14 donttemo M8 T-M8-07/08：新增 Helm Chart 渲染与清单校验步骤、M8 三大关键演练步骤
#   （演练的远程库段落由 SMOKE_DB_SWITCH 门控、真实 Redis 段落由 SMOKE_REDIS_URL 门控，CI 未设置则跳过）
# @modified 2026-10-14 donttemo v0.2.0 发布前修订（验收发现并修复）：补入 @fw/tenant——M8 T-M8-01 新增该包时
#   漏加构建与覆盖率循环，CI 干净环境下 example-api 会取不到其 dist 而构建失败；同时新增 M8 多租户端到端
#   冒烟步骤（smoke-tenant.mjs），此前多租户仅有单测与本地冒烟、无 CI 门禁
# @modified 2026-10-14 donttemo v0.2.0 推送后首次真实 Actions 运行修复：pnpm/action-setup@v4 同时配置了
#   version: 11 与根 package.json 的 packageManager(pnpm@11.6.0)，触发 ERR_PNPM_BAD_PM_VERSION 在多版本冲突处直接
#   失败（第 3 步即挂，后续步骤全 skipped）；移除 action 的 version 输入，统一以 packageManager 为准（两处 job 均已改）
# @modified 2026-10-14 donttemo v0.2.0 推送后首跑 CI 修复（二）：构建步骤此前只为 @fw/db 生成自定义输出的
#   test-client，从未为 example-api 生成默认 @prisma/client；干净环境下该 client 仅为 postinstall 空壳，
#   example-api 的 tsc 报 Prisma.InputJsonValue / Prisma.DbNull 缺失。改为在构建前显式生成两份 client
# @modified 2026-10-14 donttemo v0.2.0 推送后首跑 CI 修复（三）：把 example-api 的 .env 生成提前到 prisma generate 之前。
#   Prisma 生成的 client 会把「生成时 .env 是否存在」固化进运行期环境解析：CI 原先在 M3 步骤才 cp .env，
#   而 client 已在更早的构建步生成，导致运行期读不到 DB_URL（seed 报 PrismaClientInitializationError）。
#   本地已双向复现/验证（无 .env 生成 → seed 失败；带 .env 生成 → seed 通过）
# @modified 2026-10-14 donttemo v0.2.0 推送后首跑 CI 修复（四）：集成矩阵作业缺框架包构建。
#   该作业是独立 runner（无 base 的 dist），集成用例经 vitest 从源码运行却 import @fw/* 的包入口，
#   三库同时报 "Failed to resolve entry for package @fw/logger"。新增「构建框架包」步骤，
#   用 --filter "@fw/db..." 一次覆盖 @fw/db 及其全部依赖（config/logger/core），避免再维护易漏的手写列表
# @modified 2026-10-15 donttemo M9/PRD-009：① 三处显式包列表纳入 @fw/config-center（构建 / 覆盖率 /
#   冒烟同批，避免「本机有 dist、干净环境缺包」的假绿）；② 新增 M9 配置中心端到端冒烟步骤
#   （smoke-config.mjs：双入口生效 / 三类拒绝 / fail-keep / 审计可见 / 越权面 / 未启用形态）
# @module ci

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Prisma 遥测关闭，减少 CI 噪音
  PRISMA_TELEMETRY_DISABLED: '1'

jobs:
  # ---------- 基础门禁：构建 + 单测（SQLite）+ 静态检查 ----------
  base:
    name: 构建 / 单测(SQLite) / 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 不指定 version：由根 package.json 的 packageManager 决定（避免与 action 的 version 冲突）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # example-api 的 .env 必须在 prisma generate 之前就位：生成的 client 会把「生成时 .env 是否存在」
      # 固化进运行期环境解析，缺失时运行期直接读不到 DB_URL（migrate / seed / 起服务全部受影响）
      - name: 准备 example-api 环境文件
        working-directory: apps/example-api
        run: cp .env.example .env

      # 构建（含 prisma generate——切换 provider 后必须重新生成，防缓存旧 client 假绿）
      - name: 构建全部包
        run: |
          pnpm --filter @fw/db exec prisma generate --schema prisma/test-schema.prisma
          # example-api 的 Prisma Client 生成到默认 @prisma/client（@fw/db 的 test schema 用了自定义 output=prisma/test-client，
          # 不会填充默认 client）。干净环境缺此步时，@prisma/client 只是 postinstall 留下的空壳，example-api 的 tsc 会报
          # Prisma.InputJsonValue / Prisma.DbNull 不存在。DB_URL 仅占位，generate 不连库。
          DB_URL="file:./dev.db" pnpm --filter example-api exec prisma generate --schema prisma/schema.prisma
          # 顺序即依赖序：config-center 依赖 config/logger/core，必须排在其后（干净环境无预热 dist）
          for pkg in @fw/config @fw/logger @fw/core @fw/config-center @fw/db @fw/auth @fw/cache @fw/cli @fw/queue @fw/tenant @fw/transport @fw/telemetry; do
            pnpm --filter $pkg run build
          done
          pnpm --filter example-api run build
          pnpm --filter admin-web run build

      # 单测（SQLite 内存库，秒级反馈；turbo 管道在 Windows 沙箱不可用，CI 用 Linux 可恢复）
      # @fw/cli 的生成器测试自带临时工程与回滚断言（PRD-006 FR-07/08），不依赖真实数据库
      - name: 单元测试（SQLite）
        run: |
          for pkg in @fw/config @fw/logger @fw/core @fw/config-center @fw/db @fw/auth @fw/cache @fw/cli @fw/queue @fw/tenant @fw/transport @fw/telemetry; do
            pnpm --filter $pkg run test:coverage
          done

      # M5 管理后台前端：单测（happy-dom）+ mock 全链路冒烟（PRD-005 AC / TC-WEB）
      # 冒烟脚本自管理 vite dev server 生命周期（端口 5199，strictPort），dist 存在时附带 bundle 门禁
      - name: M5 管理后台前端门禁（单测 + mock 冒烟）
        run: |
          pnpm --filter admin-web run test
          pnpm --filter admin-web run smoke

      # M6 代码生成器：以真实 schema 跑 dry-run（解析 → 计划 → diff 预览，不落盘）
      # 覆盖 TC-GEN-004（--dry 与实际生成同源）；产物合规性由本地 vue-tsc / tsc 生成后校验
      - name: M6 生成器 dry-run 冒烟
        run: node packages/cli/dist/index.js gen crud demo-item --dry

      # M3 端到端冒烟：迁移 + 种子 + 起服务 + TC-AUTH 断言（PRD-003 AC）
      # .env 已由前置「准备 example-api 环境文件」步骤生成（须早于 prisma generate）
      - name: M3 鉴权端到端冒烟（SQLite）
        working-directory: apps/example-api
        run: |
          pnpm exec prisma migrate deploy --schema prisma/schema.prisma
          pnpm exec tsx prisma/seed.ts
          # M10 E-03：框架级限流默认开启，冒烟为可信高频调用方——CI 放大容量（脚本内 429 探测段不受影响）
          RATE_LIMIT_CAPACITY=1000000 RATE_LIMIT_REFILL_PER_SECOND=100000 node dist/main.js & echo $! > /tmp/fw-api.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/health > /dev/null && break
            sleep 1
          done
          node scripts/smoke-auth.mjs
          kill "$(cat /tmp/fw-api.pid)"

      # C-06 契约收口：管理后台端点冒烟。这些端点（字典/菜单维护/用户维护/角色维护/登录设备/审计详情）
      # 在契约与 mock 中齐全，但后端 M3 未落地，接真实 API 后集体 404 —— 本步骤逐个验证。
      # 独立起服务：登录限流计数器是进程内的，与 smoke-auth 共用进程会互相打满（429 假失败）。
      - name: C-06 管理后台端点冒烟（SQLite）
        working-directory: apps/example-api
        run: |
          RATE_LIMIT_CAPACITY=1000000 RATE_LIMIT_REFILL_PER_SECOND=100000 node dist/main.js & echo $! > /tmp/fw-api-admin.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/health > /dev/null && break
            sleep 1
          done
          node scripts/smoke-admin.mjs
          kill "$(cat /tmp/fw-api-admin.pid)"

      # M4 缓存层端到端冒烟：memory 驱动全能力 + redis 降级 + 配置守卫（PRD-004 AC）
      # 脚本自带服务生命周期（端口 3100），复用上一步已迁移/播种的 SQLite 库
      - name: M4 缓存层端到端冒烟（SQLite）
        working-directory: apps/example-api
        run: node scripts/smoke-cache.mjs

      # M7 队列与定时任务端到端冒烟：入队/重试退避/死信重放/幂等/cron/并发/限速/配置守卫（PRD-007 AC）
      # 脚本自带服务生命周期（端口 3200，分阶段以不同 MQ_* 配置起停）；bullmq 阶段需 SMOKE_REDIS_URL，未设置则跳过
      - name: M7 队列端到端冒烟（SQLite）
        working-directory: apps/example-api
        run: node scripts/smoke-queue.mjs

      # M8 多租户端到端冒烟：三级回退解析 + fail-closed + dedicated 独立库路由 + 数据权限四档
      # （PRD-008 FR-01~05 / TC-TNT-001~004）；脚本自带服务生命周期（端口 3300），
      # 复用上一步已迁移/播种的 SQLite 库，独立库文件由脚本自建
      - name: M8 多租户端到端冒烟（SQLite）
        working-directory: apps/example-api
        run: node scripts/smoke-tenant.mjs

      # M8 传输层切换端到端冒烟：in-process 往返/统计/就绪探针/错误传播 + 配置守卫（PRD-008 FR-06 / TC-TNT-005）
      # 脚本自带服务生命周期（端口 3400/3401，分阶段以不同 TRANSPORT_* 配置起停）；
      # redis 阶段（单进程往返/双进程跨进程/超时 fail-fast）需 SMOKE_REDIS_URL，未设置则跳过
      - name: M8 传输层端到端冒烟（SQLite）
        working-directory: apps/example-api
        run: node scripts/smoke-transport.mjs

      # M8 链路追踪端到端冒烟：本地 mock OTLP 收集器 + 分阶段（未启用/全采导出/跨服务同 traceId/
      # 采样门控/错误全采/配置守卫）（PRD-008 FR-07 / TC-TNT-006）；无需外部采集端
      - name: M8 链路追踪端到端冒烟（SQLite）
        working-directory: apps/example-api
        run: node scripts/smoke-telemetry.mjs

      # M9 配置中心端到端冒烟：双入口生效 / 三类拒绝 / fail-keep / 审计可见 / 越权面 / 未启用形态
      # （PRD-009 §7 AC）；脚本自带服务生命周期（端口 3450），复用 M3 步骤已迁移/播种的 SQLite 库
      - name: M9 配置中心端到端冒烟（SQLite）
        working-directory: apps/example-api
        run: node scripts/smoke-config.mjs

      # M8 三大关键演练（验收标准 §6 L3 发布门禁）：数据库切换 / 规模演进 / 依赖故障降级
      # 本地可跑段落（单体形态 / 编排演进 / Redis 降级 / 队列积压）默认执行；
      # 远程库段落（数据库切换、慢查询注入）需 SMOKE_DB_SWITCH=1，真实 Redis 段落需 SMOKE_REDIS_URL，未设置则明确跳过
      - name: M8 三大关键演练（SQLite）
        working-directory: apps/example-api
        run: node scripts/drill-m8.mjs

      # M8 T-M8-07：Helm Chart 离线渲染 + K8s 清单语义校验（本机/CI 无 helm 时的门禁兜底）
      - name: M8 Helm Chart 渲染与清单校验
        run: node scripts/check-helm-chart.mjs

      # 静态检查：文件头门禁 + 原生 SQL 白名单门禁 + 前后端接口对撞门禁
      - name: 文件头门禁
        run: pnpm run check:headers
      - name: 方言白名单门禁（TC-ORM-005）
        run: node scripts/check-no-raw-sql.mjs
      # C-06 契约收口：契约先行 + mock 顶上，前端调用面与后端路由面必须逐一对上。
      # 缺此门禁时「契约声明、mock 有、后端未注册」的端点只在接真实 API 后才 404
      - name: 前后端接口对撞门禁（C-06 API parity）
        run: node scripts/check-api-parity.mjs

  # ---------- 三库集成矩阵（TC-ORM-001：同一套用例三库各跑一遍） ----------
  integration:
    name: 集成测试 / ${{ matrix.db }}
    runs-on: ubuntu-latest
    needs: base
    strategy:
      fail-fast: false # 三库独立出报告，不互相掩盖
      matrix:
        include:
          - db: sqlite
            url: 'file:./prisma/test-int.db'
          - db: mysql
            url: 'mysql://root:root@127.0.0.1:3306/fw_test'
          - db: postgres
            url: 'postgresql://postgres:postgres@127.0.0.1:5432/fw_test'
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fw_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fw_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -h 127.0.0.1 -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      # 不指定 version：由根 package.json 的 packageManager 决定（避免与 action 的 version 冲突）
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 按矩阵生成对应 provider 的 client 与迁移（切换 provider 必须重新 generate，ADR-0002 约束 1）
      - name: 生成 ${{ matrix.db }} 客户端与表结构
        env:
          # sqlite 分支的 test-schema.prisma 读 TEST_DATABASE_URL；方言变体读 DATABASE_URL
          TEST_DATABASE_URL: ${{ matrix.url }}
          DATABASE_URL: ${{ matrix.url }}
        working-directory: packages/db
        run: |
          if [ "${{ matrix.db }}" = "sqlite" ]; then
            # SQLite 走框架迁移链（prisma/test-client），集成测试的 beforeAll 会自行 deploy
            pnpm exec prisma migrate deploy --schema prisma/test-schema.prisma
            pnpm exec prisma generate --schema prisma/test-schema.prisma
          else
            # MySQL/PG：SQLite 生成的迁移 SQL 无法在这些方言上执行，
            # 故按 ADR-0002「切换 = 改 datasource 两行 + 重建迁移」用方言 schema 生成客户端，
            # 并由 migrate diff 产出方言 DDL 建表（矩阵测试自身不建表）。
            DIALECT="${{ matrix.db == 'postgres' && 'postgresql' || matrix.db }}"
            pnpm exec prisma generate --schema "prisma/test-schema.${DIALECT}.prisma"
            DB_DRIVER="${{ matrix.db }}" DB_URL="${{ matrix.url }}" node scripts/matrix-db-setup.mjs
          fi

      # 本作业是独立 runner，没有 base 作业产出的 dist；集成用例经 vitest 从源码运行，
      # 但 import 的是 @fw/* 的包入口（exports → dist）。缺 dist 时 vitest 直接报
      # "Failed to resolve entry for package @fw/logger"。用 "...过滤器" 一次覆盖 @fw/db 及其全部依赖，
      # 避免再维护一份易漏的手写包列表。
      - name: 构建框架包（集成测试依赖其 dist）
        run: pnpm --filter "@fw/db..." run build

      - name: 集成测试 / ${{ matrix.db }}
        env:
          TEST_DATABASE_URL: ${{ matrix.url }}
          DB_DRIVER: ${{ matrix.db }}
          DB_URL: ${{ matrix.url }}
        working-directory: packages/db
        run: |
          if [ "${{ matrix.db }}" = "sqlite" ]; then
            pnpm exec vitest run src/__tests__/prisma-repository.integration.test.ts
          else
            pnpm exec vitest run src/__tests__/prisma-repository.matrix.test.ts
          fi
