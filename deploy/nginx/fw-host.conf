# @file 裸机部署 Nginx 配置（云服务器，无 Docker）
# @description 与 deploy/nginx/fw.conf（容器版）职责一致：静态资源托管 + /api 反向代理 + gzip + 上传体积 +
#   登录限流 + TLS 终止。差异仅在两处：上游由容器服务名 app:3000 改为本机 127.0.0.1:3000；
#   静态根目录由容器内 /usr/share/nginx/html 改为 release 软链下的前端产物。
#   安装：sudo cp deploy/nginx/fw-host.conf /etc/nginx/conf.d/fw.conf && sudo nginx -t && sudo systemctl reload nginx
#   完整步骤见 docs/61-bare-metal-deploy.md §10
# @author donttemo
# @created 2026-10-14
# @module deploy

upstream fw_api {
    # 裸机：应用由 systemd 托管，监听本机 3000。多实例（fw-worker@NN 的 3001+）不接外部流量，故无需轮询。
    server 127.0.0.1:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# 登录类接口限流区（防爆破；应用侧另有失败锁定）
limit_req_zone $binary_remote_addr zone=fw_auth:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 上传体积与 PRD 上传限制对齐
    client_max_body_size 16m;

    # 基础安全响应头（TLS 由下方 443 站点或云 LB 终止）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 静态资源根目录：指向 current 软链，发版切链后无需 reload nginx 即生效。
    # 前置条件：nginx 运行用户（Debian/Ubuntu 为 www-data）能穿越该路径——
    #   sudo usermod -aG fw www-data && sudo chmod -R g+rX /opt/fw/releases
    #   或不加组而放开其他用户读位：sudo chmod o+rx /opt/fw /opt/fw/current && sudo chmod -R o+rX /opt/fw/releases/*/apps/admin-web/dist
    root /opt/fw/current/apps/admin-web/dist;
    index index.html;

    # 带 hash 的构建产物可长缓存（vite 产物在 assets/ 下，文件名含内容指纹）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history 回退（M5 管理后台为纯静态产物）；index.html 不缓存，保证发版即时生效
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://fw_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 追踪头透传：上游若已带 traceparent 则续接链路（TC-TNT-006）
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_pass_header X-Trace-Id;
    }

    # 登录类接口单独限流
    location ~ ^/api/v1/auth/(login|refresh) {
        limit_req zone=fw_auth burst=20 nodelay;
        proxy_pass http://fw_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 运维端点：仅内网可访问（云服务器上通常由本机脚本直连 127.0.0.1:3000，此段为其兜底）
    location ~ ^/(health|ready|metrics) {
        proxy_pass http://fw_api;
        proxy_set_header Host $host;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }
}

# ---- HTTPS 站点（推荐：certbot 自动签发与续期）----
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.example.com -d admin.example.com
# certbot 会自动改写下方 server 块并注入 443 监听与证书路径；手工方式见注释内容。
#
# server {
#     listen 443 ssl http2;
#     server_name api.example.com;
#     ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_session_cache shared:SSL:10m;
#     # 其余 location 与上方 80 站点完全一致，可整体复制
