# @file 1Panel（OpenResty）站点接入片段
# @description 与 deploy/nginx/fw-host.conf 的差异：宿主 nginx 直接读 release 软链下的前端产物，
#   而 1Panel 的 OpenResty 运行在容器中——**网络是 host 模式（127.0.0.1 即宿主机），但文件系统是隔离的**
#   （容器内看不到 /opt/fw）。因此本片段用 1Panel 自己的站点目录作为静态根，API 走 127.0.0.1 回环。
#
#   ★ 用法：把下面 §A 或 §B 的 location 块**粘贴进 1Panel 站点的 server { } 内**，不要整份覆盖——
#     1Panel 生成的 server 块里包含它自己管理的 server_name / listen / 证书指令，覆盖会被面板改回。
#     路径：1Panel → 网站 → 站点 → 配置文件（或 网站设置 → 配置文件）。
#
#   完整步骤见 docs/62-1panel-real-deploy.md §6。
# @author donttemo
# @created 2026-10-14
# @module deploy

# ============================================================================
# 前置：以下两段必须放在 http { } 层级（不是 server 内）。
# 1Panel 的入口：网站 → 全局设置 → 「配置文件」或「配置修改」。
# ============================================================================
#
# # 登录类接口限流区（防爆破；应用侧另有 AUTH_MAX_FAILED 失败锁定，二者互补）
# limit_req_zone $binary_remote_addr zone=fw_auth:10m rate=10r/s;
#
# # 上传体积与业务限制对齐（默认 1m 会导致后台传图直接 413）
# client_max_body_size 16m;
#
# # 反代超时（默认 60s；后台导出等长任务易被掐断，可按需放宽）
# proxy_connect_timeout 60s;
# proxy_read_timeout 300s;
# proxy_send_timeout 300s;

# ============================================================================
# §A 单站点方案（推荐）：同一个域名既托管管理后台静态页，又把 /api 反代到后端
#     1Panel 操作：网站 → 创建网站 → 「静态网站」→ 域名填 fw.example.com
#     站点根目录即 1Panel 自动创建 /opt/1panel/www/sites/fw.example.com/index
#     （容器内映射为 /www/sites/fw.example.com/index，root 指令写容器内路径）
#     然后把下面整段粘进该站点的 server { }
# ============================================================================

# 带内容指纹的构建产物可长缓存（vite 产物位于 assets/，文件名含 content hash）
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# SPA history 回退；index.html 不缓存，保证发版即时生效
location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
}

# API 反向代理。OpenResty 为 host 网络，容器内 127.0.0.1 == 宿主机，直连 systemd 托管的 fw-api
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
    # 链路追踪头透传：上游已带 traceparent 时续接链路
    proxy_set_header traceparent  $http_traceparent;
    proxy_set_header X-Trace-Id   $http_x_trace_id;
    proxy_pass_header X-Trace-Id;
}

# 登录类接口单独限流（对应 http 层的 fw_auth zone）
location ~ ^/api/v1/auth/(login|refresh) {
    limit_req zone=fw_auth burst=20 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";
}

# 健康检查（供 1Panel 的「网站监控/健康检查」或云监控拨测；不要暴露 metrics）
location = /health {
    proxy_pass http://127.0.0.1:3000/health;
    proxy_set_header Host $host;
    access_log off;
}

# 运维端点仅内网可访问。注意：1Panel 的 OpenResty 为 host 网络，$remote_addr 是真实客户端 IP；
# 若前面挂了 CDN/云 LB，这里应改为仅放行 CDN 回源段，不要照抄内网网段。
location ~ ^/(ready|metrics)$ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny all;
}

# ============================================================================
# §B 双域名方案：api.example.com 只反代 API，admin.example.com 只托管静态前端
#     API 域名 → 1Panel「反向代理」网站，代理地址填 http://127.0.0.1:3000
#     管理后台 → 1Panel「静态网站」，粘贴 §A 中的 /assets/ 与 location / 两段
#     两站点各自申请证书；前端需把 VITE_API_BASE_URL 指向 API 域名并处理跨域。
#     ★ 跨域代价明显（预检请求、Cookie SameSite），单域名方案 §A 无需 CORS，优先选 §A。
# ============================================================================

# ============================================================================
# HTTPS：不要手写 443 server 块。用 1Panel 的证书流程——
#   网站 → 站点 → HTTPS → 选择「Acme 账户」申请 Let's Encrypt →
#   1Panel 自动注入 ssl_certificate 并配置续期，手写会与其抢同一个 server_name。
#   申请前务必确认：域名 A 记录已解析到本机公网 IP、云安全组已放行 80/443（
#   LE 的 HTTP-01 校验需要 80 可达）。HTTPS 开启后建议同时打开「强制 HTTPS」。
# ============================================================================
