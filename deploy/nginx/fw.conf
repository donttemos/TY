# 中档部署 Nginx 配置（T-M8-07 / docs/60-deployment-ops.md §5）
# 职责：静态资源托管 + /api 反向代理 + gzip + 上传体积 + 登录限流 + TLS 终止
# 挂载点：deploy/nginx/fw.conf → /etc/nginx/conf.d/default.conf

upstream fw_api {
    # docker compose 内部 DNS：app 服务按副本轮询
    server app:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
}

# 登录类接口限流区（防爆破；应用侧另有失败锁定）
limit_req_zone $binary_remote_addr zone=fw_auth:10m rate=10r/s;

# 静态资源站点（管理后台 dist/）
server {
    listen 80;
    server_name _;

    # gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 上传体积与 PRD 上传限制对齐
    client_max_body_size 16m;

    # SPA history 回退（M5 管理后台为纯静态产物）
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://fw_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 追踪头透传：上游若已带 traceparent 则续接链路（TC-TNT-006）
        proxy_set_header traceparent $http_traceparent;
        proxy_set_header X-Trace-Id $http_x_trace_id;
        proxy_pass_header X-Trace-Id;
    }

    # 登录类接口单独限流
    location ~ ^/api/v1/auth/(login|refresh) {
        limit_req zone=fw_auth burst=20 nodelay;
        proxy_pass http://fw_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 运维端点：仅内网可访问（Ingress / 集群内探针直连 app 容器，此处不开公网）
    location ~ ^/(health|ready|metrics) {
        proxy_pass http://fw_api;
        proxy_set_header Host $host;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
}

