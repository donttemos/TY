{{/*
@file 应用 ConfigMap（非敏感配置）
@description 渲染 values.config 全量键 + configInValues 时的非敏感连接串；Secret 引用见 deployment 的 envFrom。
@author donttemo
@created 2026-10-14
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fw-app.fullname" . }}-config
  labels:
    {{- include "fw-app.labels" . | nindent 4 }}
data:
  {{- include "fw-app.configData" . | nindent 2 }}
