{{/*
@file 应用 Secret（敏感配置）
@description 仅当 secrets.existingSecret 为空且逐键有值时渲染，避免与外部 Secret 管理冲突；
  生产必须经外部 Secret / CSI 注入，禁止把明文写入 values 文件。
@author donttemo
@created 2026-10-14
*/}}
{{- if and (not .Values.secrets.existingSecret) (or .Values.secrets.JWT_SECRET .Values.secrets.DB_URL .Values.secrets.CACHE_URL .Values.secrets.MQ_URL .Values.secrets.TRANSPORT_URL .Values.secrets.TENANT_DB_KEY .Values.secrets.JWT_SECRET_PREV) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fw-app.fullname" . }}-secrets
  labels:
    {{- include "fw-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.secrets.JWT_SECRET }}
  JWT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.JWT_SECRET_PREV }}
  JWT_SECRET_PREV: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.DB_URL }}
  DB_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.CACHE_URL }}
  CACHE_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.MQ_URL }}
  MQ_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.TRANSPORT_URL }}
  TRANSPORT_URL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.TENANT_DB_KEY }}
  TENANT_DB_KEY: {{ . | quote }}
  {{- end }}
{{- end }}
