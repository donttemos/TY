{{/*
@file ServiceAccount
@description 默认不创建（应用无需访问 K8s API）；需要时开启并绑定外部 RBAC。
@author donttemo
@created 2026-10-14
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "fw-app.serviceAccountName" . }}
  labels:
    {{- include "fw-app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
